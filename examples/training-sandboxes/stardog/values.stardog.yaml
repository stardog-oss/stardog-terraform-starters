global:
  stardog:
    enabled: true
  launchpad:
    enabled: true
  zookeeper:
    enabled: false

stardog:
  cluster:
    enabled: false
    replicaCount: 1

  backup:
    enabled: false
    cronjob:
      enabled: false

  jvm:
    minHeap: 4g
    maxHeap: 4g
    directMem: 4g
    javaArgs: "-XX:ActiveProcessorCount=3"

  persistence:
    size: 10Gi

  requests:
    cpu: 3000m
    memory: 12Gi
  limits:
    cpu: 3500m
    memory: 12Gi

  service:
    type: ClusterIP

  jwtConfig:
    enabled: false
    signer:
      enabled: true
      algorithm: HS256
      audience: "stardog"
      issuer: https://sparql.example.com:5820
      secret: "change-me"
      tokenTTL: "P7D"

  certIssuer:
    enabled: false

  ingress:
    enabled: true
    className: "nginx"
    path: "/"
    pathtype: "Prefix"
    tls:
      enabled: true

  bi:
    enabled: false
    service:
      enabled: true

  ports:
    server: 5820
    sql: 5806

  stardogProperties: |
    pack.node.join.retry.delay=1m
    security.named.graphs=false
    query.all.graphs=true
    spatial.use.jts=true
    metrics.reporter=jmx
    metrics.jvm.enabled=true
    metrics.jmx.remote.access=true
    query.timeout=1h
    logging.audit.enabled=true
    logging.audit.type=json
    logging.audit.rotation.type=time
